# Kotlin's incremental compiler tries to compute a relative path between the pub cache
# (C:\Users\...\Pub\Cache\...) and this project (D:\project\vietrar\...) — different drive
# letters have no common root, so `File.relativeTo()` throws IllegalArgumentException and
# the build fails (hit first via shared_preferences_android's Kotlin sources). Not caused by
# any project code; disabling incremental compilation is the standard workaround for this
# known Kotlin/Gradle cross-drive-letter bug.
kotlin.incremental=false
