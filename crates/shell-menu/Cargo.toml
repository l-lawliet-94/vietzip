[package]
name = "vietzip-shell-menu"
version.workspace = true
edition.workspace = true
license.workspace = true

# COM shell extension (IContextMenu/IShellExtInit) — chỉ có ý nghĩa trên Windows (Explorer),
# xem README.md trong crate này. `lib.rs` tự rỗng trên các hệ điều hành khác qua `#[cfg(windows)]`
# nên `cargo build --workspace` vẫn chạy được bình thường trên Linux/macOS khi tới lượt các nền
# tảng đó (không cần `--exclude`) — nhưng dependency `windows` chỉ thật sự tải/biên dịch trên
# Windows nhờ khai báo `target.'cfg(windows)'` dưới đây.
# "rlib" thêm vào bên cạnh "cdylib" (bắt buộc để Explorer nạp làm COM in-proc server) chỉ để
# `tests/com_smoke_test.rs` link được như 1 thư viện Rust bình thường — cho phép gọi trực
# tiếp `DllGetClassObject` trong tiến trình `cargo test` để kiểm tra thật sự vtable/dispatch
# (đúng chỗ đã có báo cáo lỗi thật trên GitHub windows-rs về InvokeCommand không được gọi ở
# 1 vài cách cài đặt ngây thơ) — mà KHÔNG cần đăng ký COM/Explorer thật.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Dùng lại `Format::from_path` làm 1 nguồn sự thật duy nhất cho "định dạng nào app này mở
# được", thay vì tự chép 1 danh sách đuôi mở rộng riêng ở đây dễ lệch pha với core.
vietzip_core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
# Macro `#[implement]` sinh code tham chiếu thẳng đường dẫn crate `windows_core::...` — cần
# khai báo trực tiếp (không chỉ gián tiếp qua `windows::core`) để những đường dẫn đó phân giải
# được. Ghim đúng version mà `windows` 0.61 dùng nội bộ (xác nhận qua Cargo.lock thật, không
# đoán) để tránh 2 bản windows-core khác nhau trong cùng dependency graph.
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
